<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Calendar Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <div class="calendar-card">
        <div class="event-banner" id="eventBanner">
            <div class="event-banner-title" id="bannerTitle">Event</div>
            <div class="event-banner-text" id="bannerText">No remarks added yet.</div>
        </div>

        <div class="header">
            <h2 id="currentMonthDisplay">Loading...</h2>
            <div class="header-controls">
                <button class="toggle-btn" id="multiSelectBtn" onclick="toggleMultiSelect()">Select Multiple</button>
                <a class="toggle-btn page-link" href="admin.html">Admin Panel</a>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
                    <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
                </div>
            </div>
        </div>

        <div class="config-section" style="border-top: none; padding-top: 0;">
            <div class="config-title">Select Day (Lights)</div>
            <div class="grid-days" id="daysGridContainer"></div>
        </div>

        <div class="config-section">
            <div class="config-title" style="text-align: center; margin-bottom: 10px;">Dates</div>
            <div class="grid-days-header" id="daysHeader"></div>
            <div class="grid-dates" id="datesContainer"></div>
        </div>

        <div class="config-section">
            <div class="config-title">Select Month (Lights)</div>
            <div class="grid-months" id="monthsContainer"></div>
        </div>
    </div>

    <!-- Single Edit Panel -->
    <div class="edit-panel" id="singleEditPanel">
        <div class="panel-header">
            <h3>Edit <span id="selectedLabel">6</span></h3>
            <button class="close-btn" onclick="closeSinglePanel()">×</button>
        </div>
        <div class="color-swatches">
            <div class="swatch" style="background: #f50057;" onclick="selectColor('#f50057', this)"></div>
            <div class="swatch" style="background: #3b82f6;" onclick="selectColor('#3b82f6', this)"></div>
            <div class="swatch" style="background: #10b981;" onclick="selectColor('#10b981', this)"></div>
            <div class="swatch" style="background: #f59e0b;" onclick="selectColor('#f59e0b', this)"></div>
            <div class="swatch" style="background: #8b5cf6;" onclick="selectColor('#8b5cf6', this)"></div>
            <div class="swatch" style="background: #ffffff; border: 2px solid #ccc;" onclick="selectColor('#ffffff', this)"></div>
            <div class="custom-color-wrapper" id="customColorWrapper" onclick="document.getElementById('colorPicker').click()">
                <input type="color" id="colorPicker" value="#f50057" onchange="handleCustomColor(this.value)">
            </div>
        </div>
        <div id="eventGroup" style="flex: 1; display: flex;">
            <input type="text" class="event-input" id="eventInput" placeholder="Add event/remark...">
        </div>
        <div class="action-buttons">
            <button class="btn btn-off" onclick="turnOffLed()">Clear</button>
            <button class="btn btn-save" onclick="saveLedData()">Save</button>
        </div>
    </div>

    <!-- Bulk Edit Panel -->
    <div class="edit-panel" id="bulkEditPanel">
        <div class="panel-header">
            <h3><span id="bulkCount">0</span> Items Selected</h3>
            <button class="close-btn" onclick="toggleMultiSelect(false)">×</button>
        </div>
        <div class="color-swatches">
            <div class="swatch" style="background: #f50057;" onclick="selectBulkColor('#f50057', this)"></div>
            <div class="swatch" style="background: #3b82f6;" onclick="selectBulkColor('#3b82f6', this)"></div>
            <div class="swatch" style="background: #10b981;" onclick="selectBulkColor('#10b981', this)"></div>
            <div class="swatch" style="background: #f59e0b;" onclick="selectBulkColor('#f59e0b', this)"></div>
            <div class="swatch" style="background: #8b5cf6;" onclick="selectBulkColor('#8b5cf6', this)"></div>
            <div class="swatch" style="background: #ffffff; border: 2px solid #ccc;" onclick="selectBulkColor('#ffffff', this)"></div>
            <div class="custom-color-wrapper" onclick="document.getElementById('bulkColorPicker').click()">
                <input type="color" id="bulkColorPicker" value="#f50057" onchange="handleBulkCustomColor(this.value)">
            </div>
        </div>
        <div class="action-buttons" style="flex: 1; justify-content: flex-end;">
            <button class="btn btn-bulk-clear" onclick="selectAllVisible()">Select All</button>
            <button class="btn btn-bulk-clear" onclick="clearSelection()">Clear</button>
            <button class="btn btn-bulk-select" onclick="applyBulkColor()">Apply Color</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
